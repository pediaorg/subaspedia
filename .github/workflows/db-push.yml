name: DB push

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Stage cuya D1 pushear (production, pr-foo, juani, ...)
        required: true
        type: string

concurrency:
  group: db-push-${{ inputs.stage }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  push:
    name: drizzle-kit push to D1
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Resolve D1 database id
        id: d1
        env:
          STAGE: ${{ inputs.stage }}
        run: |
          DB_NAME="subaspedia-$STAGE"
          DB_ID=$(pnpm wrangler d1 list --json | jq -r --arg n "$DB_NAME" '.[] | select(.name==$n) | .uuid')
          if [ -z "$DB_ID" ] || [ "$DB_ID" = "null" ]; then
            echo "::error::No existe la D1 '$DB_NAME'. Deployala primero."
            exit 1
          fi
          echo "db_id=$DB_ID" >> "$GITHUB_OUTPUT"

      - name: drizzle-kit push
        env:
          D1_DATABASE_ID: ${{ steps.d1.outputs.db_id }}
        run: yes | pnpm db push
