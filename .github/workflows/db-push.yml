name: DB push

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Nombre de la rama del PR (ej. feat/auth). Para production pasá 'production'.
        required: true
        type: string

concurrency:
  group: db-push-${{ inputs.branch }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  push:
    name: drizzle-kit push to D1
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline

      - name: Compute stage
        id: stage
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          if [ "$BRANCH" = "production" ]; then
            STAGE="production"
          else
            SLUG=$(printf '%s' "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed 's|[^a-z0-9]|-|g' | cut -c1-32 | sed 's|-$||')
            STAGE="pr-$SLUG"
          fi
          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"

      - name: Resolve D1 database id
        id: d1
        env:
          STAGE: ${{ steps.stage.outputs.stage }}
        run: |
          DB_NAME="subaspedia-$STAGE"
          ALL=$(pnpm --silent --filter @subaspedia/api exec wrangler d1 list --json 2>/dev/null)
          echo "::group::wrangler raw output"
          echo "$ALL"
          echo "::endgroup::"
          DB_ID=$(echo "$ALL" | jq -r --arg n "$DB_NAME" '.[] | select(.name==$n) | .uuid')
          if [ -z "$DB_ID" ] || [ "$DB_ID" = "null" ]; then
            echo "::error::No existe la D1 '$DB_NAME'. Deployala primero."
            exit 1
          fi
          echo "db_id=$DB_ID" >> "$GITHUB_OUTPUT"

      - name: drizzle-kit push
        env:
          D1_DATABASE_ID: ${{ steps.d1.outputs.db_id }}
        run: yes | pnpm db push
