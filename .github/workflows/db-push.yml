name: DB push

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Stage cuya D1 pushear (production, pr-foo, juani, ...)
        required: true
        type: string

concurrency:
  group: db-push-${{ inputs.stage }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  push:
    name: drizzle-kit push to D1
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: SST install providers
        run: pnpm sst setup

      - name: Read D1 id from SST secret
        id: d1
        env:
          STAGE: ${{ inputs.stage }}
        run: |
          DB_ID=$(pnpm sst secret list --stage "$STAGE" --show 2>/dev/null | awk -F'=' '/^DbId=/{print $2}')
          if [ -z "$DB_ID" ]; then
            echo "::error::Secret 'DbId' no encontrado en stage '$STAGE'. Deployalo primero."
            exit 1
          fi
          echo "db_id=$DB_ID" >> "$GITHUB_OUTPUT"

      - name: drizzle-kit push
        env:
          D1_DATABASE_ID: ${{ steps.d1.outputs.db_id }}
        run: yes | pnpm db push
