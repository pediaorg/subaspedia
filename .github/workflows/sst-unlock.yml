name: SST unlock

on:
  workflow_dispatch:
    inputs:
      stage:
        description: SST stage to unlock
        required: true
        type: string

concurrency:
  group: sst-unlock-${{ inputs.stage }}
  cancel-in-progress: false

jobs:
  unlock:
    name: Unlock stage
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_DEFAULT_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: SST unlock
        run: pnpm --filter @subaspedia/infra exec sst unlock --stage "${{ inputs.stage }}"
