name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_DEFAULT_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: SST install providers
        run: pnpm sst install
      - name: Push secrets
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: pnpm sst secret set JwtSecret "$JWT_SECRET" --stage production
      - name: SST deploy
        run: pnpm sst deploy --stage production

  release:
    name: Build APK & GitHub release
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: pnpm install --frozen-lockfile
      - name: Install EAS CLI
        run: npm i -g eas-cli
      - name: Build APK (unsigned)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          pnpm eas build \
            --platform android \
            --local \
            --profile production \
            --non-interactive \
            --output "$GITHUB_WORKSPACE/subaspedia.apk"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          TAG="v$(date +%Y.%m.%d)-${SHA:0:7}"
          gh release create "$TAG" \
            "$GITHUB_WORKSPACE/subaspedia.apk" \
            --generate-notes \
            --target "$SHA"
