name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_DEFAULT_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: SST install providers
        run: pnpm sst setup
      - name: Push secrets
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          pnpm sst secret set JwtSecret "$JWT_SECRET" --stage production --print-logs
          pnpm sst secret set ResendApiKey "$RESEND_API_KEY" --stage production --print-logs
      - name: Dump SST logs
        if: always()
        run: |
          if [ -f packages/infra/.sst/log/sst.log ]; then
            echo "::group::sst.log"
            cat packages/infra/.sst/log/sst.log
            echo "::endgroup::"
          else
            echo "no sst.log found"
          fi
      - name: SST deploy
        env:
          SST_DO_BOOTSTRAP: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: pnpm sst deploy --stage production --print-logs

  release:
    name: Build APK & GitHub release
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: pnpm install --frozen-lockfile
      - name: Install EAS CLI
        run: npm i -g eas-cli
      - name: Build APK (unsigned)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          pnpm eas build \
            --platform android \
            --local \
            --profile production \
            --non-interactive \
            --output "$GITHUB_WORKSPACE/subaspedia.apk"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          TAG="v$(date +%Y.%m.%d)-${SHA:0:7}"
          gh release create "$TAG" \
            "$GITHUB_WORKSPACE/subaspedia.apk" \
            --generate-notes \
            --target "$SHA"
