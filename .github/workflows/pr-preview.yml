name: PR preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    name: Deploy preview
    runs-on: ubuntu-latest
    outputs:
      stage: ${{ steps.stage.outputs.stage }}
      web_url: ${{ steps.stage.outputs.web_url }}
      api_url: ${{ steps.stage.outputs.api_url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_DEFAULT_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Cache SST providers
        uses: actions/cache@v4
        with:
          path: |
            ~/.pulumi
            packages/infra/.sst/platform
            packages/infra/.sst/plugins
          key: sst-providers-${{ runner.os }}-${{ hashFiles('packages/infra/sst.config.ts', 'packages/infra/package.json') }}
          restore-keys: |
            sst-providers-${{ runner.os }}-
      - name: Compute stage
        id: stage
        env:
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          SLUG=$(printf '%s' "$HEAD_REF" | tr '[:upper:]' '[:lower:]' | sed 's|[^a-z0-9]|-|g' | cut -c1-32 | sed 's|-$||')
          {
            echo "stage=pr-$SLUG"
            echo "web_url=https://pr-$SLUG.casareski.com"
            echo "api_url=https://api.pr-$SLUG.casareski.com"
          } >> "$GITHUB_OUTPUT"
      - name: SST install providers
        run: pnpm sst setup
      - name: Push secrets
        env:
          STAGE: ${{ steps.stage.outputs.stage }}
          JWT_SEED: ${{ secrets.JWT_SECRET }}
        run: |
          JWT_SECRET=$(printf '%s' "$STAGE" | openssl dgst -sha256 -hmac "$JWT_SEED" -hex | awk '{print $NF}')
          pnpm sst secret set JwtSecret "$JWT_SECRET" --stage "$STAGE" --print-logs
      - name: Dump SST logs
        if: always()
        run: |
          if [ -f packages/infra/.sst/log/sst.log ]; then
            echo "::group::sst.log"
            cat packages/infra/.sst/log/sst.log
            echo "::endgroup::"
          else
            echo "no sst.log found"
          fi
      - name: SST deploy preview
        env:
          STAGE: ${{ steps.stage.outputs.stage }}
        run: pnpm sst deploy --stage "$STAGE" --print-logs

      - name: Comment preview URLs (APK building)
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: subaspedia-preview
          message: |
            Preview deploy: **${{ steps.stage.outputs.stage }}**

            - Web: ${{ steps.stage.outputs.web_url }}
            - API: ${{ steps.stage.outputs.api_url }}
            - APK: building... ([logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}))

  db-push:
    name: drizzle-kit push to preview D1
    runs-on: ubuntu-latest
    needs: deploy
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Resolve D1 database id
        id: d1
        env:
          STAGE: ${{ needs.deploy.outputs.stage }}
        run: |
          DB_NAME="subaspedia-$STAGE"
          ALL=$(pnpm --silent --filter @subaspedia/api exec wrangler d1 list --json 2>/dev/null)
          echo "::group::wrangler raw output"
          echo "$ALL"
          echo "::endgroup::"
          DB_ID=$(echo "$ALL" | jq -r --arg n "$DB_NAME" '.[] | select(.name==$n) | .uuid')
          if [ -z "$DB_ID" ] || [ "$DB_ID" = "null" ]; then
            echo "::error::No existe la D1 '$DB_NAME'."
            exit 1
          fi
          echo "db_id=$DB_ID" >> "$GITHUB_OUTPUT"

      - name: drizzle-kit push
        env:
          D1_DATABASE_ID: ${{ steps.d1.outputs.db_id }}
        run: yes | pnpm db push

  apk:
    name: Build preview APK
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: pnpm install --frozen-lockfile
      - name: Install EAS CLI
        run: npm i -g eas-cli
      - name: Build preview APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_API_URL: ${{ needs.deploy.outputs.api_url }}
          STAGE: ${{ needs.deploy.outputs.stage }}
        run: |
          pnpm eas build \
            --platform android \
            --local \
            --profile preview \
            --non-interactive \
            --output "$GITHUB_WORKSPACE/subaspedia-$STAGE.apk"
      - name: Upload APK artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ needs.deploy.outputs.stage }}
          path: subaspedia-${{ needs.deploy.outputs.stage }}.apk
          retention-days: 14
      - name: Update PR comment with APK
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: subaspedia-preview
          message: |
            Preview deploy: **${{ needs.deploy.outputs.stage }}**

            - Web: ${{ needs.deploy.outputs.web_url }}
            - API: ${{ needs.deploy.outputs.api_url }}
            - APK: ${{ steps.upload.outputs.artifact-url }}
