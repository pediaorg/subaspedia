name: PR preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    name: Deploy preview & build APK
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_DEFAULT_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: pnpm install --frozen-lockfile
      - name: Compute stage
        id: stage
        env:
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          SLUG=$(printf '%s' "$HEAD_REF" | tr '[:upper:]' '[:lower:]' | sed 's|[^a-z0-9]|-|g' | cut -c1-32 | sed 's|-$||')
          {
            echo "stage=pr-$SLUG"
            echo "web_url=https://pr-$SLUG.casareski.com"
            echo "api_url=https://api.pr-$SLUG.casareski.com"
          } >> "$GITHUB_OUTPUT"
      - name: SST install providers
        run: pnpm sst install
      - name: Push secrets
        env:
          STAGE: ${{ steps.stage.outputs.stage }}
          JWT_SEED: ${{ secrets.JWT_SECRET }}
        run: |
          JWT_SECRET=$(printf '%s' "$STAGE" | openssl dgst -sha256 -hmac "$JWT_SEED" -hex | awk '{print $NF}')
          pnpm sst secret set JwtSecret "$JWT_SECRET" --stage "$STAGE" --print-logs
      - name: Dump SST logs
        if: always()
        run: |
          if [ -f packages/infra/.sst/log/sst.log ]; then
            echo "::group::sst.log"
            cat packages/infra/.sst/log/sst.log
            echo "::endgroup::"
          else
            echo "no sst.log found"
          fi
      - name: SST deploy preview
        env:
          STAGE: ${{ steps.stage.outputs.stage }}
        run: pnpm sst deploy --stage "$STAGE" --print-logs
      - name: Install EAS CLI
        run: npm i -g eas-cli
      - name: Build preview APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_API_URL: ${{ steps.stage.outputs.api_url }}
          STAGE: ${{ steps.stage.outputs.stage }}
        run: |
          pnpm eas build \
            --platform android \
            --local \
            --profile preview \
            --non-interactive \
            --output "$GITHUB_WORKSPACE/subaspedia-$STAGE.apk"
      - name: Upload APK artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ steps.stage.outputs.stage }}
          path: subaspedia-${{ steps.stage.outputs.stage }}.apk
          retention-days: 14
      - name: Comment on PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: subaspedia-preview
          message: |
            Preview deploy: **${{ steps.stage.outputs.stage }}**

            - Web: ${{ steps.stage.outputs.web_url }}
            - API: ${{ steps.stage.outputs.api_url }}
            - APK: ${{ steps.upload.outputs.artifact-url }}
