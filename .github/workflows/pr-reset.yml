name: PR reset

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Nombre de la rama del PR (ej. feat/auth)
        required: true
        type: string
      confirm:
        description: Reescribí el nombre de la rama para confirmar
        required: true
        type: string

concurrency:
  group: pr-reset-${{ inputs.branch }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reset:
    name: sst remove
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_DEFAULT_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Confirm branch input
        env:
          BRANCH: ${{ inputs.branch }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$BRANCH" != "$CONFIRM" ]; then
            echo "::error::El campo de confirmación no coincide con la rama."
            exit 1
          fi

      - name: Compute stage
        id: stage
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          SLUG=$(printf '%s' "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed 's|[^a-z0-9]|-|g' | cut -c1-32 | sed 's|-$||')
          STAGE="pr-$SLUG"
          if [ "$STAGE" = "pr-main" ] || [ "$STAGE" = "pr-master" ] || [ "$STAGE" = "pr-production" ]; then
            echo "::error::No se puede resetear el stage '$STAGE'."
            exit 1
          fi
          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline

      - name: SST install providers
        run: pnpm sst setup

      - name: Remove stage
        env:
          STAGE: ${{ steps.stage.outputs.stage }}
        run: pnpm sst remove --stage "$STAGE" --print-logs
