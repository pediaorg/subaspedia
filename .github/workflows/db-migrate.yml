name: DB migrate

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Stage cuya D1 migrar (production, pr-foo, juani, ...)
        required: true
        type: string
      dry_run:
        description: Solo listar migrations pendientes
        required: false
        type: boolean
        default: false

concurrency:
  group: db-migrate-${{ inputs.stage }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    name: Apply Drizzle migrations to D1
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STAGE: ${{ inputs.stage }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Generate Drizzle migrations
        run: pnpm db generate

      - name: Resolve D1 database id
        id: d1
        run: |
          DB_NAME="subaspedia-$STAGE"
          DB_ID=$(pnpm wrangler d1 list --json | jq -r --arg n "$DB_NAME" '.[] | select(.name==$n) | .uuid')
          if [ -z "$DB_ID" ] || [ "$DB_ID" = "null" ]; then
            echo "::error::No existe la D1 '$DB_NAME'. Deployá el stage primero."
            exit 1
          fi
          {
            echo "db_name=$DB_NAME"
            echo "db_id=$DB_ID"
          } >> "$GITHUB_OUTPUT"

      - name: Build CI wrangler config
        env:
          DB_NAME: ${{ steps.d1.outputs.db_name }}
          DB_ID: ${{ steps.d1.outputs.db_id }}
        run: |
          jq \
            --arg name "$DB_NAME" \
            --arg id "$DB_ID" \
            '.d1_databases[0].database_name = $name
             | .d1_databases[0].database_id = $id
             | .d1_databases[0].migrations_dir = "./drizzle"' \
            apps/api/wrangler.jsonc > apps/api/wrangler.ci.jsonc

      - name: List pending migrations
        env:
          DB_NAME: ${{ steps.d1.outputs.db_name }}
        run: pnpm wrangler d1 migrations list "$DB_NAME" --remote --config apps/api/wrangler.ci.jsonc

      - name: Apply migrations
        if: ${{ inputs.dry_run != true }}
        env:
          DB_NAME: ${{ steps.d1.outputs.db_name }}
        run: pnpm wrangler d1 migrations apply "$DB_NAME" --remote --config apps/api/wrangler.ci.jsonc
