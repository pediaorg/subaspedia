name: Stage reset

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Rama del PR (ej. feat/auth). Para resetear production, pasá 'main', 'master' o 'production'.
        required: true
        type: string
      confirm:
        description: Reescribí el nombre exacto para confirmar
        required: true
        type: string

concurrency:
  group: stage-reset-${{ inputs.branch }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reset:
    name: sst remove
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_DEFAULT_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Confirm branch input
        env:
          BRANCH: ${{ inputs.branch }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$BRANCH" != "$CONFIRM" ]; then
            echo "::error::El campo de confirmación no coincide con la rama."
            exit 1
          fi

      - name: Compute stage
        id: stage
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          case "$BRANCH" in
            main|master|production)
              STAGE="production"
              ;;
            *)
              SLUG=$(printf '%s' "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed 's|[^a-z0-9]|-|g' | cut -c1-32 | sed 's|-$||')
              STAGE="pr-$SLUG"
              ;;
          esac
          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline

      - name: SST install providers
        run: pnpm sst setup

      - name: Remove stage
        env:
          STAGE: ${{ steps.stage.outputs.stage }}
        run: pnpm sst remove --stage "$STAGE" --print-logs
